# CI: lint + typecheck + unit tests on every push/PR, then the full
# integration (RLS permission matrix) and Playwright E2E suites against a
# throwaway local Supabase stack started inside the runner. No secrets: the
# local stack's keys are generated per run and never leave the job.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  integration-and-e2e:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    env:
      SEED_PASSWORD: demo-local-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (migrations applied)
        run: supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime
      - name: Export local stack env
        run: |
          supabase status -o json > /tmp/sb.json
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL /tmp/sb.json)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r .ANON_KEY /tmp/sb.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r .SERVICE_ROLE_KEY /tmp/sb.json)" >> "$GITHUB_ENV"
      - name: Seed demo data
        run: npx tsx scripts/seed.ts
      - name: Integration tests (permission matrix + lifecycle)
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (core marketplace loop)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
